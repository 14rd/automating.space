<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Köszönjük a vásárlást — Automating</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #0a0a0a;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { max-width: 520px; width: 100%; text-align: center; border: 1px solid #e8e8e8;
    border-radius: 20px; padding: 48px 40px; box-shadow: 0 40px 80px rgba(0,0,0,0.04); }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 12px; }
  p { font-size: 16px; line-height: 1.5; color: #555; margin-bottom: 28px; }
  .btn { display: inline-block; background: #0a0a0a; color: #fff; text-decoration: none;
    font-weight: 500; font-size: 16px; padding: 15px 32px; border-radius: 100px; transition: opacity .2s; }
  .btn:hover { opacity: .85; }
  .muted { font-size: 13px; color: #999; margin-top: 22px; }
  .err { color: #b00020; }
  a.back { display: inline-block; margin-top: 24px; font-size: 14px; color: #555; }

/* ════════════════════════════════
   NO GREY PRESS / HOVER ARTEFACTS  (site-wide, every breakpoint)
   The grey box that flashes on tap is the platform tap highlight, not our own
   CSS, so it has to be switched off explicitly - it is not covered by any
   background/hover rule. The same goes for the focus ring the browser paints
   after a mouse or touch press: that is dropped via :focus:not(:focus-visible),
   which leaves the KEYBOARD focus ring fully intact for accessibility.
   touch-action: manipulation also removes the double-tap-zoom delay, which is
   what makes the highlight linger long enough to be noticed.
════════════════════════════════ */
* { -webkit-tap-highlight-color: transparent; }

a, button, summary, label, select, input, textarea,
[role="button"], [tabindex] {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

a:focus:not(:focus-visible),
button:focus:not(:focus-visible),
summary:focus:not(:focus-visible),
select:focus:not(:focus-visible),
[role="button"]:focus:not(:focus-visible),
[tabindex]:focus:not(:focus-visible) {
  outline: none;
  box-shadow: none;
}
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Köszönjük a vásárlást!</h1>
    <p id="msg">Letöltési linked elkészítése folyamatban…</p>
    <div id="action"></div>
    <p class="muted" id="note"></p>
    <a class="back" href="/">← Vissza a boltba</a>
  </div>
<script>
(async function () {
  const sid = new URLSearchParams(location.search).get('session_id');
  const msg = document.getElementById('msg');
  const action = document.getElementById('action');
  const note = document.getElementById('note');
  if (!sid) { msg.innerHTML = '<span class="err">Hiányzó rendelésazonosító.</span>'; return; }
  try {
    const res = await fetch('/api/download-link?session_id=' + encodeURIComponent(sid));
    const data = await res.json();
    if (!res.ok || !data.url) throw new Error(data.error || 'hiba');
    msg.textContent = 'A vásárlásod megerősítve: ' + (data.title || 'a csomag') + '.';
    action.innerHTML = '<a class="btn" href="' + data.url + '">Letöltés indítása</a>';
    note.textContent = 'A letöltési linket e-mailben is elküldtük. A link 24 óráig érvényes.';
  } catch (e) {
    msg.innerHTML = '<span class="err">A letöltési linket nem sikerült előállítani. ' +
      'Ha a fizetés sikeres volt, a linket e-mailben is megkapod — vagy írj a hello@automating.hu címre.</span>';
  }
})();
</script>
</body>
</html>
